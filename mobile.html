<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REMOTE</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --color-a: #00e5ff;
            --color-b: #ff003c;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            background-color: var(--bg-color); color: #fff; margin: 0; height: 100vh;
            font-family: 'Chakra Petch', sans-serif; display: flex; flex-direction: column; overflow: hidden;
            background-image: linear-gradient(#111 1px, transparent 1px), linear-gradient(90deg, #111 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; opacity: 0; transition: opacity 0.2s; }
        .screen.active { display: flex; opacity: 1; }

        .loader { width: 40px; height: 40px; border: 3px solid #333; border-top-color: var(--color-a); border-radius: 50%; animation: spin 1s infinite; margin-bottom: 20px;}
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* BOTONES */
        .btn-container { display: flex; flex-direction: column; width: 100%; height: 100%; gap: 15px; margin-top: 10px; }
        
        .vote-btn {
            flex: 1; border: none; border-radius: 10px;
            font-family: 'Chakra Petch'; font-size: 2rem; font-weight: 700; color: #000;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .vote-btn:active { transform: scale(0.98); opacity: 0.8; }

        /* COLORES Y FORMAS */
        .btn-a { background: var(--color-a); box-shadow: 0 5px 0 #00acc1; }
        .btn-b { background: var(--color-b); color: #fff; box-shadow: 0 5px 0 #c5002f; }

        h2 { margin: 0 0 10px 0; font-size: 1.8rem; }
        p { margin: 0; opacity: 0.6; }

    </style>
</head>
<body>

    <div id="sc-load" class="screen active">
        <div class="loader"></div>
        <p>CONNECTING...</p>
    </div>

    <div id="sc-wait" class="screen">
        <div style="border: 1px solid #333; padding: 20px; background: #111;">
            <h2 style="color: var(--color-a);">LINKED</h2>
            <p>Waiting for host...</p>
        </div>
    </div>

    <div id="sc-vote" class="screen">
        <p style="margin-bottom: 15px; font-size: 1rem;">MAKE YOUR CHOICE</p>
        <div class="btn-container">
            <button class="vote-btn btn-a" onclick="vote('A')">OPTION A</button>
            <button class="vote-btn btn-b" onclick="vote('B')">OPTION B</button>
        </div>
    </div>

    <div id="sc-done" class="screen">
        <div style="font-size: 3rem; color: #0f0; margin-bottom: 20px;">✓</div>
        <h2>ACCEPTED</h2>
    </div>

    <div id="sc-end" class="screen">
        <h2>END OF LINE</h2>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ROOM_ID = params.get('room');
        let userId = localStorage.getItem('sys3_uid');
        if(!userId) { userId = "u_" + Math.random().toString(36).substr(2, 6); localStorage.setItem('sys3_uid', userId); }

        let client = null; let hasVoted = false;

        if (ROOM_ID) {
            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
            client.on('connect', () => {
                client.subscribe(`sys3/${ROOM_ID}/status`);
                client.publish(`sys3/${ROOM_ID}/join`, userId);
                showScreen('sc-wait');
            });

            client.on('message', (topic, msg) => {
                const data = JSON.parse(msg.toString());
                hasVoted = false;
                handlePhase(data.phase);
            });
        } else { alert("QR Error"); }

        function handlePhase(p) {
            if (p >= 5) { showScreen('sc-end'); } else {
                const opts = [
                    ["READING", "SCROLLING"],
                    ["SALAD", "BURGER"],
                    ["SLEEP", "NETFLIX"],
                    ["PRIVACY", "FAME"]
                ];
                if(p >= 1 && p <= 4) {
                    document.querySelector('.btn-a').innerText = opts[p-1][0];
                    document.querySelector('.btn-b').innerText = opts[p-1][1];
                    showScreen('sc-vote');
                }
            }
        }

        function vote(opt) {
            if(hasVoted) return;
            if(navigator.vibrate) navigator.vibrate(50);
            client.publish(`sys3/${ROOM_ID}/vote`, opt);
            hasVoted = true;
            showScreen('sc-done');
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            setTimeout(() => { document.getElementById(id).classList.add('active'); }, 50);
        }
    </script>
</body>
</html>
