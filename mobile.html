<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --primary: #7000ff;
            --secondary: #00ffcc;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            background-color: var(--bg); color: #fff; margin: 0; height: 100vh;
            font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column;
            overflow: hidden;
        }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; transition: opacity 0.2s; opacity: 0; }
        .screen.active { display: flex; opacity: 1; }

        .mono-s { font-family: 'Roboto Mono'; font-size: 0.8rem; color: #666; letter-spacing: 1px; }

        /* LOADING */
        .bar-load { width: 40px; height: 4px; background: #333; position: relative; overflow: hidden; margin-bottom: 20px; }
        .bar-load::after { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 100%; background: var(--secondary); animation: slide 1s infinite; transform: translateX(-100%); }
        @keyframes slide { 100% { transform: translateX(100%); } }

        /* WAITING */
        .wait-box { border: 1px solid #333; padding: 30px; width: 100%; max-width: 300px; background: #0a0a0a; }

        /* BUTTONS */
        .btn-container { display: flex; flex-direction: column; gap: 15px; width: 100%; height: 100%; padding-top: 20px; padding-bottom: 20px;}
        
        .vote-btn {
            flex: 1; border: none; font-family: 'Space Grotesk'; font-weight: 700; font-size: 1.8rem;
            color: #000; cursor: pointer; transition: transform 0.1s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .vote-btn:active { transform: scale(0.98); }

        .btn-a { background: var(--secondary); clip-path: polygon(20px 0, 100% 0, 100% 100%, 0 100%, 0 20px); }
        .btn-b { background: var(--primary); color: #fff; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%); }

        /* SUCCESS */
        .check { width: 60px; height: 60px; border: 2px solid var(--secondary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--secondary); font-size: 2rem; margin-bottom: 20px; }

    </style>
</head>
<body>

    <div id="sc-load" class="screen active">
        <div class="bar-load"></div>
        <div class="mono-s">ESTABLISHING CONNECTION</div>
    </div>

    <div id="sc-wait" class="screen">
        <div class="wait-box">
            <h2 style="margin: 0 0 10px 0;">STANDBY</h2>
            <div class="mono-s">AWAITING SYSTEM INPUT</div>
        </div>
        <div class="mono-s" style="margin-top: 20px;">ID: <span id="uid-disp">...</span></div>
    </div>

    <div id="sc-vote" class="screen" style="padding: 10px;">
        <div style="width: 100%; text-align: left; padding: 0 10px;"><span class="mono-s">SELECT OPTION:</span></div>
        <div class="btn-container">
            <button class="vote-btn btn-a" onclick="vote('A')"><span id="txt-a">OPTION A</span></button>
            <button class="vote-btn btn-b" onclick="vote('B')"><span id="txt-b">OPTION B</span></button>
        </div>
    </div>

    <div id="sc-done" class="screen">
        <div class="check">✓</div>
        <h2>ACCEPTED</h2>
        <div class="mono-s">WAITING FOR NEXT CYCLE</div>
    </div>

    <div id="sc-end" class="screen">
        <h2 style="color: #666;">SESSION ENDED</h2>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ROOM_ID = params.get('room');
        
        // ID Único
        let userId = localStorage.getItem('ql_uid');
        if(!userId) { userId = "u_" + Math.random().toString(36).substr(2, 5); localStorage.setItem('ql_uid', userId); }
        document.getElementById('uid-disp').innerText = userId;

        let client = null; let hasVoted = false;

        if (ROOM_ID) {
            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
            client.on('connect', () => {
                client.subscribe(`ql_sys/${ROOM_ID}/status`);
                client.publish(`ql_sys/${ROOM_ID}/join`, userId); // Avisar que llegué
                showScreen('sc-wait');
            });

            client.on('message', (topic, msg) => {
                const data = JSON.parse(msg.toString());
                hasVoted = false;
                handlePhase(data.phase);
            });
        } else { alert("QR Error"); }

        function handlePhase(p) {
            if (p >= 5) { showScreen('sc-end'); } else {
                const opts = [
                    ["READING", "SCROLLING"],
                    ["SALAD", "BURGER"],
                    ["SLEEP 8H", "NETFLIX"],
                    ["PRIVACY", "FAME"]
                ];
                if(p >= 1 && p <= 4) {
                    document.getElementById('txt-a').innerText = opts[p-1][0];
                    document.getElementById('txt-b').innerText = opts[p-1][1];
                    showScreen('sc-vote');
                }
            }
        }

        function vote(opt) {
            if(hasVoted) return;
            if(navigator.vibrate) navigator.vibrate(50);
            client.publish(`ql_sys/${ROOM_ID}/vote`, opt);
            hasVoted = true;
            showScreen('sc-done');
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            setTimeout(() => { document.getElementById(id).classList.add('active'); }, 50);
        }
    </script>
</body>
</html>
