<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPLINK</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00f0ff; --accent-sec: #ff0055; --bg: #030305; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            background-color: var(--bg); color: #fff; margin: 0; height: 100vh;
            font-family: 'Rajdhani', sans-serif; display: flex; flex-direction: column;
            overflow: hidden;
        }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; transition: opacity 0.3s; opacity: 0; }
        .screen.active { display: flex; opacity: 1; }

        .mono { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #666; letter-spacing: 1px; }
        .title { font-size: 2rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }

        /* LOADER */
        .ring { width: 40px; height: 40px; border: 2px solid #333; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s infinite; margin-bottom: 20px;}
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* BUTTONS */
        .btn-grid { display: grid; grid-template-rows: 1fr 1fr; width: 100%; height: 100%; gap: 15px; }
        
        .vote-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 2rem; font-family: 'Rajdhani'; font-weight: 700;
            border-radius: 15px; cursor: pointer; transition: 0.1s;
            display: flex; align-items: center; justify-content: center;
        }
        
        .btn-a { border-color: var(--accent); color: var(--accent); }
        .btn-a:active { background: var(--accent); color: #000; }
        
        .btn-b { border-color: var(--accent-sec); color: var(--accent-sec); }
        .btn-b:active { background: var(--accent-sec); color: #000; }

        .success-circle { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--accent); margin-bottom: 20px; }

    </style>
</head>
<body>

    <div id="sc-load" class="screen active">
        <div class="ring"></div>
        <div class="mono">ESTABLISHING UPLINK...</div>
    </div>

    <div id="sc-wait" class="screen">
        <div class="title">STANDBY</div>
        <div class="mono">WAITING FOR HOST</div>
        <div class="mono" style="margin-top: 20px; border: 1px solid #333; padding: 5px;">ID: <span id="room-disp">...</span></div>
    </div>

    <div id="sc-vote" class="screen" style="padding: 15px;">
        <div class="btn-grid">
            <button class="vote-btn btn-a" onclick="vote('A')">OPTION A</button>
            <button class="vote-btn btn-b" onclick="vote('B')">OPTION B</button>
        </div>
    </div>

    <div id="sc-done" class="screen">
        <div class="success-circle">✓</div>
        <div class="title">DATA SENT</div>
        <div class="mono">AWAITING NEXT CYCLE</div>
    </div>

    <div id="sc-end" class="screen">
        <div class="title" style="color: #888;">SESSION END</div>
        <div class="mono">DISCONNECTING...</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ROOM_ID = params.get('room');
        document.getElementById('room-disp').innerText = ROOM_ID || "ERR";

        let client = null; let hasVoted = false;

        if (ROOM_ID) {
            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
            
            client.on('connect', () => {
                client.subscribe(`nx_sys/${ROOM_ID}/status`);
                showScreen('sc-wait');
                // Auto-join signal (optional)
                client.publish(`nx_sys/${ROOM_ID}/vote`, 'JOIN');
            });

            client.on('message', (topic, msg) => {
                const data = JSON.parse(msg.toString());
                hasVoted = false; // Reset vote for new round
                handlePhase(data.phase);
            });
        } else {
            alert("Connection Error. Please rescan QR.");
        }

        function handlePhase(p) {
            if (p >= 5) {
                showScreen('sc-end');
            } else {
                // Texts are managed by Host now. Client just shows buttons.
                if(p >= 1 && p <= 4) {
                    // Update buttons text based on round (Simplified logic)
                    const opts = [
                        ["READING", "SCROLLING"],
                        ["HEALTHY", "TASTY"],
                        ["SLEEP", "NETFLIX"],
                        ["PRIVACY", "FAME"]
                    ];
                    // Update button text locally for clarity
                    document.querySelector('.btn-a').innerText = opts[p-1][0];
                    document.querySelector('.btn-b').innerText = opts[p-1][1];
                    showScreen('sc-vote');
                }
            }
        }

        function vote(opt) {
            if(hasVoted) return;
            if(navigator.vibrate) navigator.vibrate(50);
            
            client.publish(`nx_sys/${ROOM_ID}/vote`, opt);
            hasVoted = true;
            showScreen('sc-done');
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            setTimeout(() => { document.getElementById(id).classList.add('active'); }, 50);
        }
    </script>
</body>
</html>
