<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONTROLLER</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ESTILO NEBULA */
            --bg-grad: linear-gradient(135deg, #130921, #261642, #080812);
            --neon-blue: #00f2ff;
            --neon-pink: #ff0055;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            background: var(--bg-grad); color: #fff; margin: 0; height: 100vh;
            font-family: 'Exo 2', sans-serif; display: flex; flex-direction: column; overflow: hidden;
        }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; transition: opacity 0.3s; opacity: 0; }
        .screen.active { display: flex; opacity: 1; }

        .loader { width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--neon-blue); border-radius: 50%; animation: spin 1s infinite; margin-bottom: 20px;}
        @keyframes spin { 100% { transform: rotate(360deg); } }

        h2 { text-transform: uppercase; letter-spacing: 1px; margin: 0 0 10px 0; }
        p { opacity: 0.7; margin: 0; font-size: 0.9rem; }

        /* BOTONES DEGRADADOS */
        .btn-container { display: flex; flex-direction: column; width: 100%; height: 100%; gap: 20px; margin-top: 20px; }
        
        .vote-btn {
            flex: 1; border: none; outline: none; border-radius: 20px;
            font-family: 'Exo 2'; font-size: 2rem; font-weight: 700; color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: transform 0.1s; cursor: pointer;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .vote-btn:active { transform: scale(0.96); }

        .btn-a { background: linear-gradient(135deg, #0055ff, #00c3ff); }
        .btn-b { background: linear-gradient(135deg, #ff0055, #aa00ff); }

        .success-icon { font-size: 4rem; color: var(--neon-blue); margin-bottom: 20px; text-shadow: 0 0 20px var(--neon-blue); }

    </style>
</head>
<body>

    <div id="sc-load" class="screen active">
        <div class="loader"></div>
        <p>SYNCING WITH NEBULA...</p>
    </div>

    <div id="sc-wait" class="screen">
        <div style="background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);">
            <h2 style="color: var(--neon-blue);">CONNECTED</h2>
            <p>Waiting for the round to start</p>
        </div>
    </div>

    <div id="sc-vote" class="screen">
        <p style="margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;">Tap to Choose</p>
        <div class="btn-container">
            <button class="vote-btn btn-a" onclick="vote('A')">OPTION A</button>
            <button class="vote-btn btn-b" onclick="vote('B')">OPTION B</button>
        </div>
    </div>

    <div id="sc-done" class="screen">
        <div class="success-icon">✔</div>
        <h2>RECEIVED</h2>
        <p>Stand by...</p>
    </div>

    <div id="sc-end" class="screen">
        <h2>SESSION ENDED</h2>
        <p>Thanks for playing</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ROOM_ID = params.get('room');

        let userId = localStorage.getItem('nbX_uid');
        if(!userId) { userId = "u_" + Math.random().toString(36).substr(2, 6); localStorage.setItem('nbX_uid', userId); }

        let client = null; let hasVoted = false;

        if (ROOM_ID) {
            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
            
            client.on('connect', () => {
                client.subscribe(`nbX_sys/${ROOM_ID}/status`);
                client.publish(`nbX_sys/${ROOM_ID}/join`, userId);
                showScreen('sc-wait');
            });

            client.on('message', (topic, msg) => {
                const data = JSON.parse(msg.toString());
                hasVoted = false;
                handlePhase(data.phase);
            });
        } else { alert("QR Error: Rescan needed"); }

        function handlePhase(p) {
            if (p >= 5) { showScreen('sc-end'); } else {
                const opts = [
                    ["READING", "SCROLLING"],
                    ["SALAD", "BURGER"],
                    ["SLEEP", "NETFLIX"],
                    ["PRIVACY", "FAME"]
                ];
                if(p >= 1 && p <= 4) {
                    document.querySelector('.btn-a').innerText = opts[p-1][0];
                    document.querySelector('.btn-b').innerText = opts[p-1][1];
                    showScreen('sc-vote');
                }
            }
        }

        function vote(opt) {
            if(hasVoted) return;
            if(navigator.vibrate) navigator.vibrate(50);
            client.publish(`nbX_sys/${ROOM_ID}/vote`, opt);
            hasVoted = true;
            showScreen('sc-done');
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            setTimeout(() => { document.getElementById(id).classList.add('active'); }, 50);
        }
    </script>
</body>
</html>
