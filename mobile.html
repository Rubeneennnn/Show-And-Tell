<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONTROLLER</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass: rgba(255, 255, 255, 0.1);
            --accent: #00d2ff;
            --accent-2: #ff0099;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            background: var(--bg-grad); color: #fff; margin: 0; height: 100vh;
            font-family: 'Inter', sans-serif; display: flex; flex-direction: column; overflow: hidden;
        }

        /* PANTALLAS */
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; transition: opacity 0.3s; opacity: 0; }
        .screen.active { display: flex; opacity: 1; }

        .loader { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 1s infinite; margin-bottom: 20px;}
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* TEXTOS */
        h2 { font-weight: 800; text-transform: uppercase; margin: 0; font-size: 1.5rem; letter-spacing: 1px; }
        p { font-size: 0.9rem; opacity: 0.7; margin-top: 5px; }

        /* BOTONES */
        .btn-grid { display: flex; flex-direction: column; width: 100%; height: 100%; gap: 15px; margin-top: 20px; }
        
        .vote-btn {
            flex: 1; border: none; outline: none; border-radius: 20px;
            font-size: 2rem; font-weight: 700; color: #fff;
            transition: transform 0.1s; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative; overflow: hidden;
        }
        .vote-btn:active { transform: scale(0.96); }

        .btn-a { background: linear-gradient(135deg, #00c6ff, #0072ff); }
        .btn-b { background: linear-gradient(135deg, #ff0099, #493240); }

        .status-dot { width: 8px; height: 8px; background: #00ff88; border-radius: 50%; display: inline-block; margin-right: 5px; }

    </style>
</head>
<body>

    <div id="sc-load" class="screen active">
        <div class="loader"></div>
        <p>JOINING NETWORK...</p>
    </div>

    <div id="sc-wait" class="screen">
        <div style="background: var(--glass); padding: 30px; border-radius: 20px;">
            <div class="status-dot"></div> CONNECTED
            <h2 style="margin-top: 15px;">WAITING FOR HOST</h2>
            <p>Look at the main screen</p>
        </div>
    </div>

    <div id="sc-vote" class="screen">
        <div style="width: 100%; text-align: left; padding-left: 5px;">
            <p style="margin:0; font-weight: 700; color: #fff;">CHOOSE WISELY</p>
        </div>
        <div class="btn-grid">
            <button class="vote-btn btn-a" onclick="vote('A')">OPTION A</button>
            <button class="vote-btn btn-b" onclick="vote('B')">OPTION B</button>
        </div>
    </div>

    <div id="sc-done" class="screen">
        <div style="font-size: 4rem;">✨</div>
        <h2>VOTE SENT</h2>
        <p>Stand by for next round</p>
    </div>

    <div id="sc-end" class="screen">
        <h2>SESSION CLOSED</h2>
        <p>Thanks for playing</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ROOM_ID = params.get('room');

        // GENERAR UN ID ÚNICO PARA ESTE USUARIO (Para poder contarlo)
        let userId = localStorage.getItem('nebula_uid');
        if(!userId) {
            userId = "user_" + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('nebula_uid', userId);
        }

        let client = null; 
        let hasVoted = false;

        if (ROOM_ID) {
            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
            
            client.on('connect', () => {
                // 1. Suscribirse a cambios de fase
                client.subscribe(`nb_sys/${ROOM_ID}/status`);
                
                // 2. ENVIAR SEÑAL DE "ME HE UNIDO"
                // Enviamos nuestro ID único. El host contará IDs únicos.
                client.publish(`nb_sys/${ROOM_ID}/join`, userId);

                showScreen('sc-wait');
            });

            client.on('message', (topic, msg) => {
                const data = JSON.parse(msg.toString());
                hasVoted = false;
                handlePhase(data.phase);
            });
        } else {
            alert("Error: Re-scan QR Code");
        }

        function handlePhase(p) {
            if (p >= 5) {
                showScreen('sc-end');
            } else {
                // Actualizar textos de botones (Sincronizado simple)
                const opts = [
                    ["READING", "SCROLLING"],
                    ["SALAD", "BURGER"],
                    ["SLEEP 8H", "NETFLIX"],
                    ["PRIVACY", "FAME"]
                ];
                if(p >= 1 && p <= 4) {
                    document.querySelector('.btn-a').innerText = opts[p-1][0];
                    document.querySelector('.btn-b').innerText = opts[p-1][1];
                    showScreen('sc-vote');
                }
            }
        }

        function vote(opt) {
            if(hasVoted) return;
            if(navigator.vibrate) navigator.vibrate(50);
            
            client.publish(`nb_sys/${ROOM_ID}/vote`, opt);
            hasVoted = true;
            showScreen('sc-done');
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            setTimeout(() => { document.getElementById(id).classList.add('active'); }, 50);
        }
    </script>
</body>
</html>
