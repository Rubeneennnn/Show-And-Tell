<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QUANTUM HOST</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --surface: #111111;
            --primary: #7000ff; /* Electric Purple */
            --secondary: #00ffcc; /* Teal */
            --text-main: #ffffff;
            --text-dim: #888888;
        }

        body {
            margin: 0; height: 100vh; overflow: hidden;
            background-color: var(--bg); color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* --- UI ELEMENTS --- */
        section { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.4s ease; }
        section.active { display: flex; opacity: 1; }

        h1 { font-size: 4.5rem; font-weight: 700; margin: 0; letter-spacing: -2px; line-height: 1; }
        .tagline { font-family: 'Roboto Mono', monospace; color: var(--secondary); margin-top: 15px; letter-spacing: 2px; text-transform: uppercase; font-size: 0.9rem; }

        /* QR CARD */
        .card {
            background: var(--surface); border: 1px solid #333;
            padding: 40px; border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-top: 40px; position: relative;
        }
        .card::after { content: ''; position: absolute; top: -1px; left: -1px; right: -1px; bottom: -1px; border-radius: 4px; padding: 1px; background: linear-gradient(45deg, var(--primary), transparent, var(--secondary)); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }

        /* PLAYER COUNTER */
        .player-pill {
            margin-top: 30px; background: #1a1a1a; padding: 10px 20px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px; border: 1px solid #333;
        }
        .dot { width: 8px; height: 8px; background: var(--secondary); border-radius: 50%; box-shadow: 0 0 10px var(--secondary); }

        /* GAME BARS */
        .game-layout { width: 80%; max-width: 1000px; margin-top: 60px; }
        .vs-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
        .opt-label { font-size: 2.5rem; font-weight: 700; }
        .opt-a { color: var(--secondary); }
        .opt-b { color: var(--primary); }

        .progress-track { width: 100%; height: 60px; background: #1a1a1a; position: relative; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--secondary); width: 50%; position: absolute; left: 0; top: 0; transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
        .divider { position: absolute; left: 50%; top: 0; height: 100%; width: 2px; background: #000; z-index: 10; }
        
        .stats-text { display: flex; justify-content: space-between; margin-top: 15px; font-family: 'Roboto Mono'; color: var(--text-dim); }

        /* FINAL RESULTS */
        .stat-big { font-size: 6rem; font-weight: 700; color: #fff; margin: 0; }
        .stat-label { font-family: 'Roboto Mono'; color: var(--primary); letter-spacing: 1px; }

        /* BUTTON */
        .btn-start {
            position: fixed; bottom: 40px; right: 40px;
            background: #fff; color: #000; border: none;
            padding: 20px 40px; font-family: 'Roboto Mono'; font-weight: 700;
            cursor: pointer; transition: 0.2s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .btn-start:hover { background: var(--secondary); }

        #qr-area img { display: block; border: 10px solid #fff; }
    </style>
</head>
<body>

    <section id="view-0" class="active">
        <h1>QUANTUM LAB</h1>
        <div class="tagline">HUMAN BEHAVIOR ANALYSIS</div>
        
        <div class="card">
            <div id="qr-area"></div>
        </div>
        <div style="margin-top: 10px; font-family: 'Roboto Mono'; font-size: 0.7rem; color: #444;" id="url-debug">...</div>

        <div class="player-pill">
            <div class="dot"></div>
            <span style="font-family: 'Roboto Mono'; font-size: 0.9rem;">SUBJECTS CONNECTED: <span id="player-count" style="color:#fff; font-weight:bold;">0</span></span>
        </div>
    </section>

    <section id="view-game">
        <div class="tagline">DATA STREAM // SEQUENCE <span id="round-idx">01</span></div>
        <h1 id="round-title" style="font-size: 4rem; margin-top: 20px;">LOADING</h1>

        <div class="game-layout">
            <div class="vs-row">
                <div class="opt-label opt-a" id="lbl-a">A</div>
                <div class="opt-label opt-b" id="lbl-b">B</div>
            </div>
            
            <div class="progress-track">
                <div class="progress-fill" id="main-bar"></div>
                <div class="divider"></div>
            </div>

            <div class="stats-text">
                <div id="pct-a">50%</div>
                <div>TOTAL INPUTS: <span id="vote-total" style="color: #fff;">0</span></div>
                <div id="pct-b">50%</div>
            </div>
        </div>
    </section>

    <section id="view-stats">
        <h1>ANALYSIS COMPLETE</h1>
        <div style="display: flex; gap: 80px; margin-top: 60px; text-align: center;">
            <div>
                <div class="stat-big" id="stat-total">0</div>
                <div class="stat-label">TOTAL DECISIONS</div>
            </div>
            <div>
                <div class="stat-big" id="stat-winner" style="font-size: 3rem; line-height: 2; color: var(--secondary)">-</div>
                <div class="stat-label">DOMINANT TRAIT</div>
            </div>
        </div>
    </section>

    <button class="btn-start" onclick="nextPhase()" id="btn-next">INITIALIZE TEST</button>

    <script>
        // --- SETUP ---
        const ROOM_ID = "QL_" + Math.floor(Math.random() * 9999);
        let baseUrl = window.location.href.replace('index.html', '');
        if(!baseUrl.endsWith('/')) baseUrl += '/';
        const mobileUrl = baseUrl + "mobile.html?room=" + ROOM_ID;
        
        document.getElementById('url-debug').innerText = mobileUrl;
        new QRCode(document.getElementById("qr-area"), { text: mobileUrl, width: 200, height: 200 });

        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        const topics = { vote: `ql_sys/${ROOM_ID}/vote`, join: `ql_sys/${ROOM_ID}/join`, status: `ql_sys/${ROOM_ID}/status` };

        // --- VARIABLES DE ESTADO ---
        let currentPhase = 0;
        let votes = { A: 0, B: 0 };
        let allVotes = {}; // Aquí guardaremos todo
        let connectedPlayers = new Set();

        client.on('connect', () => { 
            client.subscribe(topics.vote); 
            client.subscribe(topics.join);
        });

        client.on('message', (topic, msg) => {
            if (topic === topics.join) {
                connectedPlayers.add(msg.toString());
                document.getElementById('player-count').innerText = connectedPlayers.size;
            }
            if (topic === topics.vote) {
                const val = msg.toString();
                if(val === 'A') votes.A++;
                if(val === 'B') votes.B++;
                updateDisplay();
            }
        });

        // --- CORRECCIÓN DEL BUG ---
        function nextPhase() {
            // 1. ANTES DE CAMBIAR DE FASE, GUARDAMOS LOS DATOS ACTUALES
            if (currentPhase > 0 && currentPhase <= 4) {
                allVotes[currentPhase] = {...votes};
                console.log("Datos guardados fase " + currentPhase, allVotes[currentPhase]);
            }

            // 2. AHORA SÍ CAMBIAMOS DE FASE
            currentPhase++;
            votes = { A: 0, B: 0 }; // Reseteamos contadores para la nueva ronda

            // 3. ACTUALIZAMOS LA VISTA
            client.publish(topics.status, JSON.stringify({ phase: currentPhase }));
            
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            const btn = document.getElementById('btn-next');

            if (currentPhase <= 4) {
                // ESTAMOS EN JUEGO
                document.getElementById('view-game').classList.add('active');
                setupRound(currentPhase);
                btn.innerText = (currentPhase === 4) ? "CALCULATE RESULTS" : "NEXT SEQUENCE >>";
            } else {
                // ESTAMOS EN RESULTADOS
                document.getElementById('view-stats').classList.add('active');
                btn.style.display = 'none';
                showResults();
            }
        }

        function setupRound(r) {
            const data = [
                { t: "FOCUS", a: "READING", b: "SCROLLING" },
                { t: "DIET", a: "SALAD", b: "BURGER" },
                { t: "REST", a: "SLEEP 8H", b: "NETFLIX" },
                { t: "SOCIAL", a: "PRIVACY", b: "FAME" }
            ];
            const d = data[r-1];
            document.getElementById('round-idx').innerText = "0" + r;
            document.getElementById('round-title').innerText = d.t;
            document.getElementById('lbl-a').innerText = d.a;
            document.getElementById('lbl-b').innerText = d.b;
            updateDisplay();
        }

        function updateDisplay() {
            const total = votes.A + votes.B;
            document.getElementById('vote-total').innerText = total;
            let pctA = 50;
            if (total > 0) pctA = (votes.A / total) * 100;
            
            document.getElementById('main-bar').style.width = pctA + "%";
            document.getElementById('pct-a').innerText = Math.round(pctA) + "%";
            document.getElementById('pct-b').innerText = Math.round(100 - pctA) + "%";
        }

        function showResults() {
            // Ya no guardamos nada aquí, porque se guardó al inicio de nextPhase()
            let totalInputs = 0; 
            let dopamineScore = 0;
            
            // Sumamos las 4 rondas
            for(let r=1; r<=4; r++) { 
                if(allVotes[r]) { 
                    totalInputs += (allVotes[r].A + allVotes[r].B); 
                    dopamineScore += allVotes[r].B; 
                } 
            }
            
            document.getElementById('stat-total').innerText = totalInputs;
            
            const ratio = totalInputs > 0 ? (dopamineScore / totalInputs) : 0;
            const winner = ratio > 0.5 ? "INSTANT GRATIFICATION" : "DELAYED GRATIFICATION";
            document.getElementById('stat-winner').innerText = winner;
        }
    </script>
</body>
</html>
