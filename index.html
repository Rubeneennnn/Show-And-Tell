<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS OS // HOST</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #00f0ff;
            --accent-sec: #ff0055;
            --bg: #030305;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; height: 100vh; overflow: hidden;
            background-color: var(--bg); color: #fff;
            font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* BACKGROUND ANIMATION */
        .bg-grid {
            position: absolute; width: 200vw; height: 200vh;
            background-image: 
                radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            opacity: 0.3; z-index: -1;
        }
        @keyframes gridMove { 0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); } 100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); } }

        /* UI CONTAINERS */
        section { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        section.active { display: flex; opacity: 1; }

        /* TYPOGRAPHY */
        .hero-title {
            font-size: 5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 10px;
            background: linear-gradient(90deg, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 0;
        }
        .mono-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-top: 15px;}

        /* QR PANEL */
        .glass-panel {
            background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid var(--border); padding: 40px;
            border-radius: 20px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin-top: 40px; animation: float 6s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* GAME UI */
        .vs-container { width: 70%; margin-top: 60px; position: relative; }
        .bar-track { width: 100%; height: 60px; background: rgba(255,255,255,0.05); border-radius: 30px; overflow: hidden; position: relative; }
        .bar-fill { height: 100%; width: 50%; background: linear-gradient(90deg, var(--accent), #fff, var(--accent-sec)); position: absolute; left: 0; transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: 0 0 30px rgba(255,255,255,0.1); }
        .vs-badge { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; padding: 5px 15px; border-radius: 20px; border: 1px solid #333; font-weight: 700; z-index: 10; font-family: 'JetBrains Mono'; }
        
        .options-row { display: flex; justify-content: space-between; margin-top: 20px; font-size: 2.5rem; font-weight: 700; text-transform: uppercase; }
        .opt-a { color: var(--accent); text-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
        .opt-b { color: var(--accent-sec); text-shadow: 0 0 20px rgba(255, 0, 85, 0.3); }

        .stats-row { display: flex; justify-content: space-between; margin-top: 10px; font-family: 'JetBrains Mono'; color: #666; font-size: 1.2rem; }

        /* CONTROL BUTTON */
        .btn-control {
            position: fixed; bottom: 40px; right: 40px;
            background: transparent; color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 15px 30px; border-radius: 30px;
            font-family: 'JetBrains Mono'; cursor: pointer;
            transition: 0.3s; z-index: 100;
        }
        .btn-control:hover { background: #fff; color: #000; }

    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <section id="view-0" class="active">
        <div class="hero-title">NEXUS</div>
        <div class="mono-sub">SECURE UPLINK READY</div>
        
        <div class="glass-panel">
            <div id="qr-area"></div>
            <div style="margin-top: 20px; color: #555; font-family: 'JetBrains Mono'; font-size: 0.8rem;" id="url-debug">Generating Link...</div>
        </div>
        
        <div class="mono-sub" style="margin-top: 40px; color: #fff;">CONNECTED DEVICES: <span id="player-count" style="color: var(--accent)">0</span></div>
    </section>

    <section id="view-game">
        <div class="mono-sub">SEQUENCE <span id="round-idx">01</span> // LIVE FEED</div>
        <h1 class="hero-title" id="round-title" style="font-size: 4rem; margin-top: 20px;">LOADING</h1>

        <div class="vs-container">
            <div class="bar-track">
                <div class="bar-fill" id="main-bar"></div>
                <div class="vs-badge">VS</div>
            </div>
            
            <div class="options-row">
                <div class="opt-a" id="lbl-a">OPTION A</div>
                <div class="opt-b" id="lbl-b">OPTION B</div>
            </div>

            <div class="stats-row">
                <div id="pct-a">50%</div>
                <div>VOTES: <span id="vote-total">0</span></div>
                <div id="pct-b">50%</div>
            </div>
        </div>
    </section>

    <section id="view-stats">
        <div class="hero-title" style="font-size: 3rem;">SYSTEM REPORT</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 50px;">
            <div class="glass-panel">
                <div style="font-size: 4rem; font-weight: 700;" id="stat-total">0</div>
                <div class="mono-sub">TOTAL INTERACTIONS</div>
            </div>
            <div class="glass-panel">
                <div style="font-size: 2rem; font-weight: 700; color: var(--accent);" id="stat-winner">-</div>
                <div class="mono-sub">DOMINANT BEHAVIOR</div>
            </div>
        </div>
    </section>

    <button class="btn-control" onclick="nextPhase()" id="btn-next">INITIALIZE SYSTEM</button>

    <script>
        // --- AUDIO ENGINE (Minimal & Professional) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.frequency.value = freq; osc.type = type;
            osc.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        // --- CORE LOGIC ---
        const ROOM_ID = "NEXUS_" + Math.floor(Math.random() * 10000);
        
        // URL Logic for GitHub Pages
        let baseUrl = window.location.href.replace('index.html', '');
        if(!baseUrl.endsWith('/')) baseUrl += '/';
        const mobileUrl = baseUrl + "mobile.html?room=" + ROOM_ID;
        
        document.getElementById('url-debug').innerText = mobileUrl;
        new QRCode(document.getElementById("qr-area"), { text: mobileUrl, width: 220, height: 220, colorDark: "#fff", colorLight: "#00000000", correctLevel: QRCode.CorrectLevel.H }); // Transparent QR

        // MQTT Setup
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        const topics = { vote: `nx_sys/${ROOM_ID}/vote`, status: `nx_sys/${ROOM_ID}/status` };

        let currentPhase = 0;
        let votes = { A: 0, B: 0 };
        let allVotes = {};

        client.on('connect', () => { console.log("HOST ONLINE: " + ROOM_ID); client.subscribe(topics.vote); });

        client.on('message', (topic, msg) => {
            const val = msg.toString();
            if (val === 'A') votes.A++;
            if (val === 'B') votes.B++;
            
            updateDisplay();
            playTone(800, 'sine'); // Soft blip

            if(currentPhase === 0) document.getElementById('player-count').innerText = (votes.A + votes.B);
        });

        function nextPhase() {
            currentPhase++; playTone(200, 'square'); // Phase change sound
            if(currentPhase > 1) allVotes[currentPhase-1] = {...votes};
            votes = { A: 0, B: 0 };
            
            client.publish(topics.status, JSON.stringify({ phase: currentPhase }));
            
            updateUI();
        }

        function updateUI() {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            const btn = document.getElementById('btn-next');

            if (currentPhase <= 4) {
                document.getElementById('view-game').classList.add('active');
                setupRound(currentPhase);
                btn.innerText = (currentPhase === 4) ? "FINALIZE SESSION" : "NEXT SEQUENCE";
            } else {
                document.getElementById('view-stats').classList.add('active');
                btn.style.display = 'none';
                calcStats();
            }
        }

        function setupRound(r) {
            // ENGLISH CONTENT - NO SUBTITLES
            const data = [
                { t: "ATTENTION", a: "READING", b: "SCROLLING" },
                { t: "CRAVING", a: "HEALTHY", b: "TASTY" },
                { t: "DISCIPLINE", a: "SLEEP", b: "NETFLIX" },
                { t: "VALUES", a: "PRIVACY", b: "FAME" }
            ];
            const d = data[r-1];
            document.getElementById('round-idx').innerText = "0" + r;
            document.getElementById('round-title').innerText = d.t;
            document.getElementById('lbl-a').innerText = d.a;
            document.getElementById('lbl-b').innerText = d.b;
            updateDisplay();
        }

        function updateDisplay() {
            const total = votes.A + votes.B;
            document.getElementById('vote-total').innerText = total;
            let pctA = 50;
            if (total > 0) pctA = (votes.A / total) * 100;
            
            document.getElementById('main-bar').style.width = pctA + "%";
            document.getElementById('pct-a').innerText = Math.round(pctA) + "%";
            document.getElementById('pct-b').innerText = Math.round(100 - pctA) + "%";
        }

        function calcStats() {
            allVotes[4] = {...votes};
            let total = 0; let dopa = 0;
            for(let r=1; r<=4; r++) { if(allVotes[r]) { total += (allVotes[r].A + allVotes[r].B); dopa += allVotes[r].B; } }
            
            document.getElementById('stat-total').innerText = total;
            const ratio = total > 0 ? (dopa / total) : 0;
            const winner = ratio > 0.5 ? "INSTANT GRATIFICATION" : "DELAYED GRATIFICATION";
            document.getElementById('stat-winner').innerText = winner;
        }
    </script>
</body>
</html>
