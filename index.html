<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FINAL HOST</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* COLORES DE ALTO CONTRASTE */
            --bg-color: #050505;
            --grid-color: rgba(255, 255, 255, 0.05);
            
            --color-a: #00e5ff; /* Cyan Eléctrico (Opción A) */
            --color-b: #ff003c; /* Rojo Neón (Opción B - Dopamina) */
        }

        body {
            margin: 0; height: 100vh; overflow: hidden;
            background-color: var(--bg-color); color: #fff;
            font-family: 'Chakra Petch', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            
            /* FONDO DE REJILLA PARA MEJOR VISIBILIDAD */
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* SOMBRA VINETEADA PARA DAR PROFUNDIDAD */
        body::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, #000 100%);
            pointer-events: none; z-index: -1;
        }

        /* ELEMENTOS UI */
        section { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.5s ease; }
        section.active { display: flex; opacity: 1; }

        h1 { font-size: 4rem; margin: 0; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .sub { color: #888; font-size: 1.2rem; margin-top: 10px; letter-spacing: 1px; }

        /* QR PANEL */
        .panel {
            background: rgba(20, 20, 20, 0.8); border: 1px solid #333;
            padding: 30px; border-radius: 10px; margin-top: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* BARRAS DE JUEGO */
        .game-container { width: 90%; max-width: 1200px; margin-top: 50px; }
        
        .labels { display: flex; justify-content: space-between; font-size: 3rem; font-weight: 700; margin-bottom: 20px; text-transform: uppercase;}
        .lbl-a { color: var(--color-a); text-shadow: 0 0 25px rgba(0, 229, 255, 0.4); }
        .lbl-b { color: var(--color-b); text-shadow: 0 0 25px rgba(255, 0, 60, 0.4); }

        .bar-track {
            width: 100%; height: 100px; background: #111; border: 2px solid #333;
            display: flex; position: relative; border-radius: 5px; overflow: hidden;
        }
        
        .bar-fill { height: 100%; transition: width 0.5s ease-out; }
        .fill-a { background: var(--color-a); width: 50%; box-shadow: inset -5px 0 20px rgba(0,0,0,0.3); }
        .fill-b { background: var(--color-b); width: 50%; box-shadow: inset 5px 0 20px rgba(0,0,0,0.3); }

        .vs-center {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            background: #000; padding: 5px 15px; border: 1px solid #555; font-weight: bold; z-index: 10;
        }

        .stats-detail { display: flex; justify-content: space-between; font-size: 1.5rem; margin-top: 15px; font-weight: 600; opacity: 0.9; }

        /* RESULTADOS FINALES */
        .winner-box {
            border: 2px solid #fff; padding: 40px; margin-top: 30px; text-align: center;
            background: rgba(0,0,0,0.8); width: 60%;
        }
        .score-row { display: flex; gap: 40px; margin-top: 20px; justify-content: center; color: #aaa; font-size: 1.2rem; }

        /* BOTON */
        .btn-action {
            position: fixed; bottom: 30px; right: 30px;
            background: #fff; color: #000; border: none; padding: 15px 30px;
            font-family: 'Chakra Petch'; font-weight: 700; font-size: 1.2rem;
            cursor: pointer; text-transform: uppercase; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .btn-action:hover { background: var(--color-a); }

    </style>
</head>
<body>

    <section id="view-0" class="active">
        <h1>SYSTEM LINK</h1>
        <div class="sub">SCAN TO CONNECT</div>
        
        <div class="panel">
            <div id="qr-area"></div>
        </div>
        
        <div style="margin-top: 30px; font-size: 1.5rem;">
            PLAYERS: <span id="player-count" style="color: var(--color-a); font-weight: bold;">0</span>
        </div>
    </section>

    <section id="view-game">
        <div class="sub">ROUND <span id="round-idx">01</span></div>
        <h1 id="round-title" style="font-size: 3.5rem; margin-bottom: 20px;">LOADING...</h1>

        <div class="game-container">
            <div class="labels">
                <span class="lbl-a" id="lbl-a">OPTION A</span>
                <span class="lbl-b" id="lbl-b">OPTION B</span>
            </div>
            
            <div class="bar-track">
                <div class="bar-fill fill-a" id="bar-a"></div>
                <div class="vs-center">VS</div>
                <div class="bar-fill fill-b" id="bar-b"></div>
            </div>

            <div class="stats-detail">
                <span style="color: var(--color-a)" id="pct-a">50%</span>
                <span style="font-size: 1rem; color: #555;">TOTAL: <span id="vote-total">0</span></span>
                <span style="color: var(--color-b)" id="pct-b">50%</span>
            </div>
        </div>
    </section>

    <section id="view-stats">
        <h1>DIAGNOSTIC RESULT</h1>
        
        <div class="winner-box" id="winner-container">
            <div class="sub">DOMINANT BEHAVIOR</div>
            <div style="font-size: 4rem; font-weight: 700; margin: 20px 0; line-height: 1.1;" id="stat-winner">
                CALCULATING...
            </div>
        </div>

        <div class="score-row">
            <span style="color: var(--color-a)">DISCIPLINE: <b id="score-a">0</b></span>
            <span>|</span>
            <span style="color: var(--color-b)">DOPAMINE: <b id="score-b">0</b></span>
        </div>
    </section>

    <button class="btn-action" onclick="nextPhase()" id="btn-next">START GAME</button>

    <script>
        const ROOM_ID = "SYS_" + Math.floor(Math.random() * 10000);
        let baseUrl = window.location.href.replace('index.html', '');
        if(!baseUrl.endsWith('/')) baseUrl += '/';
        const mobileUrl = baseUrl + "mobile.html?room=" + ROOM_ID;
        
        new QRCode(document.getElementById("qr-area"), { text: mobileUrl, width: 220, height: 220, colorDark: "#fff", colorLight: "#00000000" });

        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        const topics = { vote: `sys3/${ROOM_ID}/vote`, join: `sys3/${ROOM_ID}/join`, status: `sys3/${ROOM_ID}/status` };

        let currentPhase = 0;
        let votes = { A: 0, B: 0 };
        let allVotes = {}; 
        let connectedPlayers = new Set();

        client.on('connect', () => { 
            client.subscribe(topics.vote); 
            client.subscribe(topics.join);
        });

        client.on('message', (topic, msg) => {
            if (topic === topics.join) {
                connectedPlayers.add(msg.toString());
                document.getElementById('player-count').innerText = connectedPlayers.size;
            }
            if (topic === topics.vote) {
                const val = msg.toString();
                if(val === 'A') votes.A++;
                if(val === 'B') votes.B++;
                updateDisplay();
            }
        });

        function nextPhase() {
            // Guardar datos de la ronda anterior ANTES de avanzar
            if (currentPhase > 0 && currentPhase <= 4) {
                allVotes[currentPhase] = { A: votes.A, B: votes.B };
            }

            currentPhase++;
            votes = { A: 0, B: 0 }; // Reseteo
            
            client.publish(topics.status, JSON.stringify({ phase: currentPhase }));
            updateDisplay(); // Resetea barras visuales a 50/50
            
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            const btn = document.getElementById('btn-next');

            if (currentPhase <= 4) {
                document.getElementById('view-game').classList.add('active');
                setupRound(currentPhase);
                btn.innerText = (currentPhase === 4) ? "FINISH & CALC" : "NEXT ROUND >>";
            } else {
                document.getElementById('view-stats').classList.add('active');
                btn.style.display = 'none';
                showResults();
            }
        }

        function setupRound(r) {
            const data = [
                { t: "ATTENTION", a: "READING", b: "SCROLLING" },
                { t: "FOOD", a: "SALAD", b: "BURGER" },
                { t: "HABITS", a: "SLEEP 8H", b: "NETFLIX" },
                { t: "VALUES", a: "PRIVACY", b: "FAME" }
            ];
            const d = data[r-1];
            document.getElementById('round-idx').innerText = "0" + r;
            document.getElementById('round-title').innerText = d.t;
            document.getElementById('lbl-a').innerText = d.a;
            document.getElementById('lbl-b').innerText = d.b;
        }

        function updateDisplay() {
            const total = votes.A + votes.B;
            document.getElementById('vote-total').innerText = total;
            
            let pctA = 50;
            let pctB = 50;

            if (total > 0) {
                pctA = (votes.A / total) * 100;
                pctB = (votes.B / total) * 100;
            }
            
            document.getElementById('bar-a').style.width = pctA + "%";
            document.getElementById('bar-b').style.width = pctB + "%";

            document.getElementById('pct-a').innerText = Math.round(pctA) + "%";
            document.getElementById('pct-b').innerText = Math.round(pctB) + "%";
        }

        function showResults() {
            let totalA = 0;
            let totalB = 0;

            // Suma estricta de todas las rondas guardadas
            for (let r = 1; r <= 4; r++) {
                if (allVotes[r]) {
                    totalA += allVotes[r].A;
                    totalB += allVotes[r].B;
                }
            }

            // Mostrar puntuación numérica (Debug para ti y claridad para ellos)
            document.getElementById('score-a').innerText = totalA;
            document.getElementById('score-b').innerText = totalB;

            const wContainer = document.getElementById('winner-container');
            const wText = document.getElementById('stat-winner');

            if (totalB > totalA) {
                // GANA DOPAMINA
                wText.innerText = "INSTANT GRATIFICATION";
                wText.style.color = "var(--color-b)"; // Rojo
                wContainer.style.borderColor = "var(--color-b)";
                wContainer.style.boxShadow = "0 0 50px rgba(255, 0, 60, 0.3)";
            } else if (totalA > totalB) {
                // GANA DISCIPLINA
                wText.innerText = "DELAYED GRATIFICATION";
                wText.style.color = "var(--color-a)"; // Azul
                wContainer.style.borderColor = "var(--color-a)";
                wContainer.style.boxShadow = "0 0 50px rgba(0, 229, 255, 0.3)";
            } else {
                // EMPATE
                wText.innerText = "PERFECT BALANCE";
                wText.style.color = "#fff";
                wContainer.style.borderColor = "#fff";
            }
        }
    </script>
</body>
</html>
