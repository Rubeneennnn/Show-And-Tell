<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS CORE // HOST</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon-blue: #00f3ff; --neon-pink: #ff0055; --neon-green: #0aff0a; --bg: #050505; --panel: rgba(20, 20, 30, 0.8); }
        body { margin: 0; height: 100vh; overflow: hidden; background-color: var(--bg); color: #fff; font-family: 'Orbitron', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        
        /* Efecto CRT Scanline */
        body::after { content: ""; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 999; }

        section { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.5s; }
        section.active { display: flex; opacity: 1; }

        .glitch-text { font-size: 5rem; font-weight: 900; text-transform: uppercase; text-shadow: 2px 2px 0px var(--neon-pink), -2px -2px 0px var(--neon-blue); animation: glitch 1s infinite alternate-reverse; margin: 0; letter-spacing: 5px; text-align: center; }
        @keyframes glitch { 0% { text-shadow: 2px 2px 0px var(--neon-pink), -2px -2px 0px var(--neon-blue); } 100% { text-shadow: -2px 2px 0px var(--neon-pink), 2px -2px 0px var(--neon-blue); } }

        .sub-text { font-family: 'Share Tech Mono', monospace; color: var(--neon-blue); font-size: 1.2rem; margin-top: 10px; letter-spacing: 2px; }

        /* QR BOX */
        .qr-frame { padding: 20px; border: 2px solid var(--neon-blue); background: rgba(0,0,0,0.5); box-shadow: 0 0 20px var(--neon-blue); margin-top: 40px; position: relative; }
        .qr-frame::before { content: "SCAN_UPLINK"; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--bg); padding: 0 10px; color: var(--neon-blue); font-size: 0.8rem; letter-spacing: 2px; }

        /* BARS */
        .vs-container { width: 80%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between; position: relative; margin-top: 50px; }
        .bar-wrapper { width: 45%; height: 60px; background: #111; border: 1px solid #333; position: relative; transform: skewX(-20deg); overflow: hidden; }
        .bar { height: 100%; width: 0%; transition: width 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .bar-a { background: var(--neon-blue); float: right; box-shadow: 0 0 30px var(--neon-blue); }
        .bar-b { background: var(--neon-pink); float: left; box-shadow: 0 0 30px var(--neon-pink); }
        .vs-center { font-size: 3rem; font-weight: 900; color: #fff; z-index: 10; text-shadow: 0 0 20px #fff; }
        .label-row { width: 80%; max-width: 1000px; display: flex; justify-content: space-between; margin-top: 20px; font-size: 2rem; text-transform: uppercase; font-weight: 700; }
        .txt-a { color: var(--neon-blue); text-align: left; }
        .txt-b { color: var(--neon-pink); text-align: right; }

        /* BTN */
        .control-panel { position: fixed; bottom: 30px; right: 30px; display: flex; gap: 20px; z-index: 1000; }
        .btn { background: transparent; border: 2px solid var(--neon-green); color: var(--neon-green); padding: 15px 40px; font-family: 'Orbitron'; font-size: 1.2rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
        .btn:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 20px var(--neon-green); }

        /* STATS */
        .stats-box { border: 1px solid #333; padding: 40px; background: var(--panel); width: 60%; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 40px; }
        .stat-num { font-size: 4rem; color: #fff; margin: 0; }
        .stat-desc { color: #888; font-family: 'Share Tech Mono'; }
    </style>
</head>
<body>

    <section id="view-0" class="active">
        <h1 class="glitch-text">SYSTEM READY</h1>
        <div class="sub-text">ESTABLISHING SECURE CONNECTION...</div>
        <div class="qr-frame" id="qr-area"></div>
        <div class="sub-text" style="margin-top:20px; font-size: 0.9rem; opacity: 0.7;" id="url-debug">Generating Link...</div>
        <div class="sub-text" style="color: var(--neon-green); margin-top: 20px;">VOTES DETECTED: <span id="player-count">0</span></div>
    </section>

    <section id="view-game">
        <div class="sub-text" style="position: absolute; top: 50px;">LIVE DATA STREAM // ROUND <span id="round-idx">01</span></div>
        <h1 class="glitch-text" id="round-title" style="font-size: 4rem;">LOADING</h1>
        <div class="label-row"><div class="txt-a" id="lbl-a">A</div><div class="txt-b" id="lbl-b">B</div></div>
        <div class="vs-container">
            <div class="bar-wrapper"><div class="bar bar-a" id="bar-a"></div></div>
            <div class="vs-center">VS</div>
            <div class="bar-wrapper"><div class="bar bar-b" id="bar-b"></div></div>
        </div>
        <div class="label-row" style="font-family: 'Share Tech Mono'; font-size: 1.5rem;">
            <div class="txt-a"><span id="pct-a">0</span>%</div>
            <div class="txt-b"><span id="pct-b">0</span>%</div>
        </div>
        <div class="sub-text" style="margin-top: 20px;">TOTAL INPUTS: <span id="vote-total">0</span></div>
    </section>

    <section id="view-stats">
        <h1 class="glitch-text" style="color: var(--neon-green); text-shadow: none;">ANALYSIS COMPLETE</h1>
        <div class="stats-box">
            <div><h2 class="stat-num" id="stat-total">0</h2><div class="stat-desc">TOTAL DECISIONS MADE</div></div>
            <div><h2 class="stat-num" id="stat-winner">-</h2><div class="stat-desc">DOMINANT BEHAVIOR PROFILE</div></div>
        </div>
    </section>

    <div class="control-panel"><button class="btn" onclick="nextPhase()" id="btn-next">INITIALIZE GAME</button></div>

    <script>
        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'vote') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'phase') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
                osc.start(); osc.stop(audioCtx.currentTime + 1);
            }
        }

        // --- SETUP & NETWORK ---
        const ROOM_ID = "SESSION_" + Math.floor(Math.random() * 9999);
        
        // **NUEVA LÓGICA DE URL PARA INDEX.HTML**
        // Detecta dónde estamos y busca mobile.html en la misma carpeta
        let baseUrl = window.location.href;
        // Si la url termina en index.html, lo quitamos
        baseUrl = baseUrl.replace('index.html', '');
        // Si no termina en barra, la añadimos
        if(!baseUrl.endsWith('/')) baseUrl += '/';
        
        const mobileUrl = baseUrl + "mobile.html?room=" + ROOM_ID;
        
        document.getElementById('url-debug').innerText = mobileUrl;
        new QRCode(document.getElementById("qr-area"), { text: mobileUrl, width: 200, height: 200, colorDark: "#000", colorLight: "#00f3ff", correctLevel: QRCode.CorrectLevel.H });

        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        const topics = { vote: `adv_game/${ROOM_ID}/vote`, status: `adv_game/${ROOM_ID}/status` };

        let currentPhase = 0;
        let votes = { A: 0, B: 0 };
        let allVotes = {};

        client.on('connect', () => { console.log("UPLINK: " + ROOM_ID); client.subscribe(topics.vote); });

        client.on('message', (topic, msg) => {
            if (topic === topics.vote) {
                const val = msg.toString();
                if (val === 'A') votes.A++;
                if (val === 'B') votes.B++;
                updateChart(); playSound('vote'); 
                if(currentPhase === 0) document.getElementById('player-count').innerText = (votes.A + votes.B);
            }
        });

        function nextPhase() {
            currentPhase++; playSound('phase');
            if(currentPhase > 1) allVotes[currentPhase-1] = {...votes};
            votes = { A: 0, B: 0 };
            client.publish(topics.status, JSON.stringify({ phase: currentPhase }));

            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            const btn = document.getElementById('btn-next');

            if (currentPhase <= 4) {
                document.getElementById('view-game').classList.add('active');
                setupRound(currentPhase);
                btn.innerText = (currentPhase === 4) ? "CALCULATE RESULTS" : "NEXT SEQUENCE >>";
            } else {
                document.getElementById('view-stats').classList.add('active');
                btn.style.display = 'none';
                showResults();
            }
        }

        function setupRound(r) {
            const data = [
                { t: "ATTENTION WAR", a: "READ BOOK", b: "TIKTOK" },
                { t: "CRAVING", a: "EAT SALAD", b: "EAT BURGER" },
                { t: "DISCIPLINE", a: "SLEEP 8H", b: "NETFLIX" },
                { t: "VALIDATION", a: "PRIVACY", b: "FAME" }
            ];
            const d = data[r-1];
            document.getElementById('round-idx').innerText = "0" + r;
            document.getElementById('round-title').innerText = d.t;
            document.getElementById('lbl-a').innerText = d.a;
            document.getElementById('lbl-b').innerText = d.b;
            updateChart();
        }

        function updateChart() {
            const total = votes.A + votes.B;
            document.getElementById('vote-total').innerText = total;
            let pctA = 50, pctB = 50;
            if (total > 0) { pctA = (votes.A / total) * 100; pctB = 100 - pctA; }
            document.getElementById('bar-a').style.width = pctA + "%";
            document.getElementById('bar-b').style.width = pctB + "%";
            document.getElementById('pct-a').innerText = Math.round(pctA);
            document.getElementById('pct-b').innerText = Math.round(pctB);
        }

        function showResults() {
            allVotes[4] = {...votes};
            let totalInputs = 0; let dopamineScore = 0;
            for(let r=1; r<=4; r++) { if(allVotes[r]) { totalInputs += (allVotes[r].A + allVotes[r].B); dopamineScore += allVotes[r].B; } }
            document.getElementById('stat-total').innerText = totalInputs;
            const ratio = totalInputs > 0 ? (dopamineScore / totalInputs) : 0;
            const winner = ratio > 0.5 ? "INSTANT GRATIFICATION" : "DELAYED GRATIFICATION";
            const color = ratio > 0.5 ? "var(--neon-pink)" : "var(--neon-blue)";
            const wEl = document.getElementById('stat-winner');
            wEl.innerText = winner; wEl.style.color = color; wEl.style.textShadow = `0 0 20px ${color}`;
        }
    </script>
</body>
</html>
