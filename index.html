<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEBULA HOST</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #00d2ff;
            --accent-2: #3a7bd5;
            --text: #ffffff;
        }

        body {
            margin: 0; height: 100vh; overflow: hidden;
            background: var(--bg-grad); color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* FONDO ANIMADO */
        .orb {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; z-index: -1;
            animation: float 10s infinite ease-in-out;
        }
        .orb-1 { width: 400px; height: 400px; background: #8e2de2; top: -10%; left: -10%; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: #4a00e0; bottom: -5%; right: -5%; animation-delay: -5s; }
        @keyframes float { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(30px, -30px); } }

        /* CONTENEDORES */
        section { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: all 0.5s ease; }
        section.active { display: flex; opacity: 1; transform: scale(1); }

        /* TARJETAS DE CRISTAL */
        .glass-card {
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 40px; text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            margin-top: 30px;
        }

        /* TEXTOS */
        h1 { font-size: 4rem; font-weight: 800; margin: 0; letter-spacing: -2px; text-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .sub { font-size: 1.2rem; font-weight: 300; opacity: 0.8; margin-top: 10px; letter-spacing: 1px; }
        
        /* JUEGO */
        .battle-arena { width: 80%; max-width: 900px; margin-top: 40px; }
        
        .bar-container {
            width: 100%; height: 80px; background: rgba(0,0,0,0.3); border-radius: 40px;
            overflow: hidden; position: relative; margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .bar-fill {
            height: 100%; width: 50%;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            position: absolute; left: 0; top:0;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .vs-badge {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            background: #fff; color: #000; font-weight: 800; padding: 10px 20px;
            border-radius: 20px; z-index: 10; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .labels { display: flex; justify-content: space-between; font-size: 2.5rem; font-weight: 700; text-transform: uppercase; }
        .lbl-a { color: #00c6ff; text-shadow: 0 0 20px rgba(0,198,255,0.4); }
        .lbl-b { color: #ff0099; text-shadow: 0 0 20px rgba(255,0,153,0.4); }

        /* ESTADISTICAS */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 40px; }
        .stat-num { font-size: 5rem; font-weight: 800; margin: 0; line-height: 1; background: linear-gradient(to bottom, #fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* BOTON FLOTANTE */
        .fab {
            position: fixed; bottom: 40px; right: 40px;
            background: #fff; color: #000;
            padding: 15px 35px; border-radius: 50px;
            font-weight: 700; font-size: 1rem; cursor: pointer;
            border: none; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s; z-index: 100;
        }
        .fab:hover { transform: translateY(-5px); }

        /* QR COLOR FIX */
        #qr-area img { display: block; } /* Quita espacios extra */

    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <section id="view-0" class="active">
        <h1>NEBULA</h1>
        <div class="sub">SCAN TO JOIN SESSION</div>
        
        <div class="glass-card">
            <div id="qr-area"></div>
        </div>

        <div style="margin-top: 30px; display: flex; align-items: center; gap: 10px;">
            <div style="width: 10px; height: 10px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 10px #00ff88;"></div>
            <div class="sub" style="margin:0; font-weight: 600; font-size: 1.1rem;">
                PLAYERS READY: <span id="player-count">0</span>
            </div>
        </div>
        <div class="sub" style="font-size: 0.8rem; margin-top: 5px; opacity: 0.5;" id="url-debug">...</div>
    </section>

    <section id="view-game">
        <div class="sub">ROUND <span id="round-idx">01</span></div>
        <h1 id="round-title" style="font-size: 3.5rem;">LOADING...</h1>

        <div class="battle-arena">
            <div class="labels">
                <span class="lbl-a" id="lbl-a">A</span>
                <span class="lbl-b" id="lbl-b">B</span>
            </div>
            
            <div class="bar-container">
                <div class="bar-fill" id="main-bar"></div>
                <div class="vs-badge">VS</div>
            </div>

            <div style="display: flex; justify-content: space-between; font-weight: 600; opacity: 0.8;">
                <span id="pct-a">50%</span>
                <span>TOTAL VOTES: <span id="vote-total">0</span></span>
                <span id="pct-b">50%</span>
            </div>
        </div>
    </section>

    <section id="view-stats">
        <h1>SESSION REPORT</h1>
        <div class="stats-grid">
            <div class="glass-card" style="margin:0;">
                <div class="stat-num" id="stat-total">0</div>
                <div class="sub">TOTAL INTERACTIONS</div>
            </div>
            <div class="glass-card" style="margin:0;">
                <div class="stat-num" style="font-size: 2.5rem;" id="stat-winner">-</div>
                <div class="sub">DOMINANT PROFILE</div>
            </div>
        </div>
    </section>

    <button class="fab" onclick="nextPhase()" id="btn-next">START SESSION</button>

    <script>
        // --- LÓGICA DE URL ---
        const ROOM_ID = "NB_" + Math.floor(Math.random() * 100000);
        let baseUrl = window.location.href.replace('index.html', '');
        if(!baseUrl.endsWith('/')) baseUrl += '/';
        const mobileUrl = baseUrl + "mobile.html?room=" + ROOM_ID;
        
        document.getElementById('url-debug').innerText = mobileUrl; // Debug visual
        
        // QR (Blanco y negro limpio)
        new QRCode(document.getElementById("qr-area"), { 
            text: mobileUrl, 
            width: 200, height: 200, 
            colorDark: "#000000", colorLight: "#ffffff", 
            correctLevel: QRCode.CorrectLevel.H 
        });

        // --- CONEXIÓN & CONTADOR JUGADORES ---
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        const topics = { 
            vote: `nb_sys/${ROOM_ID}/vote`, 
            join: `nb_sys/${ROOM_ID}/join`,   // Canal para contar gente
            status: `nb_sys/${ROOM_ID}/status` 
        };

        let currentPhase = 0;
        let votes = { A: 0, B: 0 };
        let allVotes = {};
        let connectedPlayers = new Set(); // Para no contar repetidos (si mandan ID)

        client.on('connect', () => { 
            console.log("HOST ONLINE", ROOM_ID); 
            client.subscribe(topics.vote);
            client.subscribe(topics.join);
        });

        client.on('message', (topic, msg) => {
            const val = msg.toString();

            // 1. ALGUIEN SE UNE
            if (topic === topics.join) {
                // val es el ID único del móvil
                connectedPlayers.add(val);
                document.getElementById('player-count').innerText = connectedPlayers.size;
                // Efecto visual simple
                const countEl = document.getElementById('player-count');
                countEl.style.transform = "scale(1.5)";
                setTimeout(() => countEl.style.transform = "scale(1)", 200);
            }

            // 2. ALGUIEN VOTA
            if (topic === topics.vote) {
                if(val === 'A') votes.A++;
                if(val === 'B') votes.B++;
                updateDisplay();
            }
        });

        // --- FASES DEL JUEGO ---
        function nextPhase() {
            currentPhase++;
            if(currentPhase > 1) allVotes[currentPhase-1] = {...votes};
            votes = { A: 0, B: 0 };
            
            // Avisar a los móviles
            client.publish(topics.status, JSON.stringify({ phase: currentPhase }));
            
            updateUI();
        }

        function updateUI() {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            const btn = document.getElementById('btn-next');

            if (currentPhase <= 4) {
                document.getElementById('view-game').classList.add('active');
                setupRound(currentPhase);
                btn.innerText = (currentPhase === 4) ? "FINISH REPORT" : "NEXT ROUND →";
            } else {
                document.getElementById('view-stats').classList.add('active');
                btn.style.display = 'none';
                calcStats();
            }
        }

        function setupRound(r) {
            const data = [
                { t: "ATTENTION", a: "READING", b: "SCROLLING" },
                { t: "CHOICES", a: "SALAD", b: "BURGER" },
                { t: "RECOVERY", a: "SLEEP 8H", b: "NETFLIX" },
                { t: "SOCIAL", a: "PRIVACY", b: "FAME" }
            ];
            const d = data[r-1];
            document.getElementById('round-idx').innerText = "0" + r;
            document.getElementById('round-title').innerText = d.t;
            document.getElementById('lbl-a').innerText = d.a;
            document.getElementById('lbl-b').innerText = d.b;
            updateDisplay();
        }

        function updateDisplay() {
            const total = votes.A + votes.B;
            document.getElementById('vote-total').innerText = total;
            let pctA = 50;
            if (total > 0) pctA = (votes.A / total) * 100;
            
            document.getElementById('main-bar').style.width = pctA + "%";
            document.getElementById('pct-a').innerText = Math.round(pctA) + "%";
            document.getElementById('pct-b').innerText = Math.round(100 - pctA) + "%";
        }

        function calcStats() {
            allVotes[4] = {...votes};
            let total = 0; let dopa = 0;
            for(let r=1; r<=4; r++) { if(allVotes[r]) { total += (allVotes[r].A + allVotes[r].B); dopa += allVotes[r].B; } }
            
            document.getElementById('stat-total').innerText = total;
            const ratio = total > 0 ? (dopa / total) : 0;
            const winner = ratio > 0.5 ? "INSTANT GRATIFICATION" : "SELF CONTROL";
            document.getElementById('stat-winner').innerText = winner;
        }
    </script>
</body>
</html>
