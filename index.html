<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOPAMINE TEST</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23000000%22/><text x=%2250%22 y=%2262%22 font-family=%22Arial, sans-serif%22 font-size=%2255%22 font-weight=%22bold%22 fill=%22%23ffffff%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>RI</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* VUELVEN LOS COLORES NEBULA */
            --bg-grad: linear-gradient(135deg, #130921, #261642, #080812);
            --neon-blue: #00f2ff; /* Opción A */
            --neon-pink: #ff0055; /* Opción B */
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0; height: 100vh; overflow: hidden;
            background: var(--bg-grad); color: #fff;
            font-family: 'Exo 2', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* ORBES FLOTANTES (VUELVEN) */
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.6; z-index: -1; animation: float 12s infinite ease-in-out; }
        .orb-1 { width: 500px; height: 500px; background: #5500ff; top: -10%; left: -10%; }
        .orb-2 { width: 400px; height: 400px; background: #ff0055; bottom: -10%; right: -10%; animation-delay: -5s; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(40px); } }

        /* INTERFAZ */
        section { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: all 0.5s ease; }
        section.active { display: flex; opacity: 1; transform: scale(1); }

        h1 { font-size: 5rem; font-weight: 900; margin: 0; text-shadow: 0 0 40px rgba(255,255,255,0.1); letter-spacing: 2px; }
        .sub-text { font-size: 1.2rem; color: #bbb; margin-top: 10px; font-weight: 300; letter-spacing: 1px; text-transform: uppercase; }

        /* TARJETA QR DE CRISTAL */
        .glass-panel {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border); padding: 40px; border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4); margin-top: 30px;
        }

        /* --- BARRA DE DUELO (Estilo Tira y Afloja) --- */
        .duel-container { width: 85%; max-width: 1100px; margin-top: 50px; }
        
        .bar-track {
            width: 100%; height: 80px; background: rgba(0,0,0,0.5); border-radius: 40px;
            overflow: hidden; position: relative; display: flex;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .bar-part { height: 100%; transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        
        /* Barra A (Azul) */
        #bar-a { background: linear-gradient(90deg, #0055ff, var(--neon-blue)); box-shadow: 0 0 30px rgba(0, 242, 255, 0.3); }
        /* Barra B (Rosa) */
        #bar-b { background: linear-gradient(90deg, var(--neon-pink), #8800ff); box-shadow: 0 0 30px rgba(255, 0, 85, 0.3); }

        .vs-badge {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            background: #fff; color: #000; font-weight: 900; padding: 0 15px; height: 40px;
            border-radius: 20px; z-index: 10; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .labels-row { display: flex; justify-content: space-between; font-size: 2.8rem; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; }
        .txt-a { color: var(--neon-blue); text-shadow: 0 0 20px rgba(0,242,255,0.5); }
        .txt-b { color: var(--neon-pink); text-shadow: 0 0 20px rgba(255,0,85,0.5); }

        .stats-row { display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: 700; margin-top: 10px; color: #fff; opacity: 0.9; }

        /* --- RESULTADOS FINALES --- */
        .winner-display {
            background: var(--glass); padding: 50px; border-radius: 30px; border: 1px solid var(--border);
            text-align: center; margin-top: 30px; backdrop-filter: blur(30px);
            width: 70%;
        }
        
        .winner-title { font-size: 3.5rem; font-weight: 900; line-height: 1.2; margin: 20px 0; }

        /* Puntos pequeños para verificar */
        .debug-score { display: flex; justify-content: center; gap: 30px; margin-top: 30px; font-size: 1.1rem; color: #aaa; opacity: 0.8; }

        /* BOTÓN FLOTANTE */
        .fab {
            position: fixed; bottom: 40px; right: 40px;
            background: #fff; color: #000; border: none;
            padding: 15px 40px; border-radius: 50px; font-weight: 900; font-size: 1.1rem;
            cursor: pointer; box-shadow: 0 0 20px rgba(255,255,255,0.3); transition: transform 0.2s;
        }
        .fab:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <section id="view-0" class="active">
        <h1>DOPAMINE TEST</h1>
        <div class="sub-text">SYSTEM READY // WAITING FOR PLAYERS</div>
        
        <div class="glass-panel">
            <div id="qr-area"></div>
        </div>
        
        <div style="margin-top:20px; display:flex; align-items:center; gap:10px;">
            <div style="width:10px; height:10px; background:#fff; border-radius:50%; box-shadow:0 0 10px #fff;"></div>
            <div class="sub-text" style="margin:0; color:#fff;">
                CONNECTED: <span id="player-count" style="font-weight:bold; font-size:1.3rem;">0</span>
            </div>
        </div>
    </section>

    <section id="view-game">
        <div class="sub-text">SEQUENCE <span id="round-idx">01</span></div>
        <h1 id="round-title" style="margin-bottom: 30px;">LOADING...</h1>

        <div class="duel-container">
            <div class="labels-row">
                <span class="txt-a" id="lbl-a">A</span>
                <span class="txt-b" id="lbl-b">B</span>
            </div>
            
            <div class="bar-track">
                <div class="bar-part" id="bar-a" style="width: 50%;"></div>
                <div class="vs-badge">VS</div>
                <div class="bar-part" id="bar-b" style="width: 50%;"></div>
            </div>

            <div class="stats-row">
                <span id="pct-a">50%</span>
                <span style="font-size: 1rem; opacity: 0.7; font-weight: 400;">TOTAL: <span id="vote-total">0</span></span>
                <span id="pct-b">50%</span>
            </div>
        </div>
    </section>

    <section id="view-stats">
        <h1 style="font-size: 3rem;">ANALYSIS COMPLETE</h1>
        
        <div class="winner-display" id="win-card">
            <div class="sub-text">DOMINANT PROFILE DETECTED</div>
            <div class="winner-title" id="stat-winner">CALCULATING...</div>
        </div>

        <div class="debug-score">
            <span style="color: var(--neon-blue)">DISCIPLINE SCORE: <b id="score-a">0</b></span>
            <span>|</span>
            <span style="color: var(--neon-pink)">DOPAMINE SCORE: <b id="score-b">0</b></span>
        </div>
    </section>

    <button class="fab" onclick="nextPhase()" id="btn-next">START SESSION</button>

    <script>
        const ROOM_ID = "NB_" + Math.floor(Math.random() * 9999);
        let baseUrl = window.location.href.replace('index.html', '');
        if(!baseUrl.endsWith('/')) baseUrl += '/';
        const mobileUrl = baseUrl + "mobile.html?room=" + ROOM_ID;
        
        new QRCode(document.getElementById("qr-area"), { text: mobileUrl, width: 220, height: 220, colorDark: "#000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });

        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        const topics = { vote: `nbX_sys/${ROOM_ID}/vote`, join: `nbX_sys/${ROOM_ID}/join`, status: `nbX_sys/${ROOM_ID}/status` };

        let currentPhase = 0;
        let votes = { A: 0, B: 0 };
        let allVotes = {}; // Memoria de votos
        let connectedPlayers = new Set();

        client.on('connect', () => { 
            client.subscribe(topics.vote); 
            client.subscribe(topics.join);
        });

        client.on('message', (topic, msg) => {
            if (topic === topics.join) {
                connectedPlayers.add(msg.toString());
                document.getElementById('player-count').innerText = connectedPlayers.size;
            }
            if (topic === topics.vote) {
                const val = msg.toString();
                if(val === 'A') votes.A++;
                if(val === 'B') votes.B++;
                updateDisplay();
            }
        });

        function nextPhase() {
            // 1. GUARDAR DATOS ANTES DE RESETEAR
            if (currentPhase > 0 && currentPhase <= 4) {
                allVotes[currentPhase] = { A: votes.A, B: votes.B };
            }

            // 2. AVANZAR FASE
            currentPhase++;
            votes = { A: 0, B: 0 }; // Reset
            
            client.publish(topics.status, JSON.stringify({ phase: currentPhase }));
            
            // 3. ACTUALIZAR UI
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            const btn = document.getElementById('btn-next');

            if (currentPhase <= 4) {
                document.getElementById('view-game').classList.add('active');
                setupRound(currentPhase);
                updateDisplay(); // Reset barras visuales
                btn.innerText = (currentPhase === 4) ? "FINISH REPORT" : "NEXT ROUND →";
            } else {
                document.getElementById('view-stats').classList.add('active');
                btn.style.display = 'none';
                showResults();
            }
        }

        function setupRound(r) {
            const data = [
                { t: "WHAT DO YOU DO MOST?", a: "READING", b: "SCROLLING" },
                { t: "WHAT DO YOU PREFER?", a: "SALAD", b: "BURGER" },
                { t: "WHAT DO YOU DO MOST?", a: "SLEEP 8H", b: "NETFLIX" },
                { t: "WHAT DO YOU PREFER?", a: "PRIVACY", b: "FAME" }
            ];
            const d = data[r-1];
            document.getElementById('round-idx').innerText = "0" + r;
            document.getElementById('round-title').innerText = d.t;
            document.getElementById('lbl-a').innerText = d.a;
            document.getElementById('lbl-b').innerText = d.b;
        }

        function updateDisplay() {
            const total = votes.A + votes.B;
            document.getElementById('vote-total').innerText = total;
            
            let pctA = 50; 
            let pctB = 50;

            if (total > 0) {
                pctA = (votes.A / total) * 100;
                pctB = (votes.B / total) * 100;
            }
            
            // DUELO DE BARRAS
            document.getElementById('bar-a').style.width = pctA + "%";
            document.getElementById('bar-b').style.width = pctB + "%";

            document.getElementById('pct-a').innerText = Math.round(pctA) + "%";
            document.getElementById('pct-b').innerText = Math.round(pctB) + "%";
        }

        function showResults() {
            let totalA = 0;
            let totalB = 0;

            // Suma estricta de todos los votos guardados
            for(let r=1; r<=4; r++) { 
                if(allVotes[r]) { 
                    totalA += allVotes[r].A; 
                    totalB += allVotes[r].B; 
                } 
            }

            // Mostrar puntuación numérica real (Debug)
            document.getElementById('score-a').innerText = totalA;
            document.getElementById('score-b').innerText = totalB;

            const wTitle = document.getElementById('stat-winner');
            const wCard = document.getElementById('win-card');

            // Lógica infalible
            if (totalB > totalA) {
                // GANA DOPAMINA
                wTitle.innerText = "INSTANT GRATIFICATION";
                wTitle.style.color = "var(--neon-pink)";
                wTitle.style.textShadow = "0 0 30px var(--neon-pink)";
                wCard.style.borderColor = "var(--neon-pink)";
                wCard.style.boxShadow = "0 0 50px rgba(255, 0, 85, 0.2)";
            } else if (totalA > totalB) {
                // GANA DISCIPLINA
                wTitle.innerText = "DELAYED GRATIFICATION";
                wTitle.style.color = "var(--neon-blue)";
                wTitle.style.textShadow = "0 0 30px var(--neon-blue)";
                wCard.style.borderColor = "var(--neon-blue)";
                wCard.style.boxShadow = "0 0 50px rgba(0, 242, 255, 0.2)";
            } else {
                wTitle.innerText = "PERFECT BALANCE";
                wTitle.style.color = "#fff";
            }
        }
    </script>
</body>
</html>
